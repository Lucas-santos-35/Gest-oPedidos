<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gestão de Balcão</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input, select { outline: none !important; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-slate-100">

    <div id="root"></div>

    <script>
        // Estado da Aplicação
        let state = {
            activeTab: 'pedidos',
            isAdding: false,
            searchTerm: '',
            filterType: 'Todos',
            showFilters: false,
            showReport: false,
            reportMode: 'dashboard',
            pedidos: JSON.parse(localStorage.getItem('balcao_v3_data')) || [
                { id: 1, nome: 'João Silva', publicacao: 'Tradução do Novo Mundo', status: 'Pendente', categoria: 'Bíblia', data: '2023-10-25' },
                { id: 2, nome: 'Maria Santos', publicacao: 'Seja Feliz para Sempre!', status: 'Entregue', categoria: 'Livro', data: '2023-10-24' }
            ]
        };

        function save() {
            localStorage.setItem('balcao_v3_data', JSON.stringify(state.pedidos));
            render();
        }

        const getStats = () => {
            const total = state.pedidos.length;
            const entregues = state.pedidos.filter(p => p.status === 'Entregue').length;
            const pendentes = state.pedidos.filter(p => p.status === 'Pendente').length;
            const pct = total > 0 ? Math.round((entregues / total) * 100) : 0;
            return { total, entregues, pendentes, pct };
        };

        const getStatusStyles = (status) => {
            switch (status) {
                case 'Pendente': return 'text-amber-600 bg-amber-50';
                case 'Encomendado': return 'text-blue-600 bg-blue-50';
                case 'Disponível': return 'text-purple-600 bg-purple-50';
                case 'Entregue': return 'text-green-600 bg-green-50';
                default: return 'text-slate-500 bg-slate-50';
            }
        };

        function render() {
            const root = document.getElementById('root');
            const stats = getStats();
            
            root.innerHTML = `
                <div class="flex flex-col h-screen bg-slate-50 max-w-md mx-auto relative overflow-hidden shadow-2xl">
                    
                    <!-- Cabeçalho Mais Discreto (Cor Slate-800) -->
                    <header class="bg-slate-800 shrink-0 shadow-md">
                        <div class="px-5 pt-6 pb-4">
                            <div class="flex justify-between items-center mb-4">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 bg-indigo-500 rounded-xl flex items-center justify-center shadow-md">
                                        <i data-lucide="layers" class="text-white w-4 h-4"></i>
                                    </div>
                                    <h1 class="text-white flex flex-col">
                                        <span class="text-[8px] uppercase tracking-widest font-light text-slate-400">Gestão de</span>
                                        <span class="text-base font-black tracking-tight">Balcão</span>
                                    </h1>
                                </div>
                                <button onclick="state.activeTab='pedidos'; state.filterType='Todos'; render()" class="flex items-center gap-1.5 bg-slate-700/50 hover:bg-slate-700 px-3 py-1.5 rounded-full border border-white/5 transition-all">
                                    <span class="text-[10px] font-bold text-slate-300 uppercase tracking-tighter">Pendentes</span>
                                    <span class="text-xs font-black text-white">${stats.pendentes}</span>
                                </button>
                            </div>

                            <nav class="flex bg-slate-900/40 p-1 rounded-xl">
                                ${['pedidos', 'estoque', 'historico'].map(tab => `
                                    <button onclick="changeTab('${tab}')" class="flex-1 flex items-center justify-center gap-2 py-2 rounded-lg transition-all ${state.activeTab === tab ? 'bg-white text-slate-900 shadow-md' : 'text-slate-500'}">
                                        <i data-lucide="${tab === 'pedidos' ? 'clipboard-list' : tab === 'estoque' ? 'package' : 'activity'}" class="w-3.5 h-3.5"></i>
                                        <span class="text-[10px] font-bold uppercase tracking-wide">${tab === 'historico' ? 'Dash' : tab}</span>
                                    </button>
                                `).join('')}
                            </nav>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 no-scrollbar">
                        ${renderTabContent(stats)}
                    </main>

                    <!-- FAB Compacto -->
                    ${(!state.isAdding && state.activeTab === 'pedidos') ? `
                        <button onclick="toggleAdd(true)" class="absolute bottom-6 right-6 bg-slate-800 text-white w-12 h-12 rounded-2xl shadow-xl flex items-center justify-center active:scale-95 transition-all z-30 border-2 border-white">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </button>
                    ` : ''}

                    <!-- Modals -->
                    ${state.isAdding ? renderAddModal() : ''}
                    ${state.showReport ? renderReportModal(stats) : ''}
                </div>
            `;
            lucide.createIcons();
        }

        function renderTabContent(stats) {
            if (state.activeTab === 'historico') {
                return `
                    <div class="space-y-4 animate-in fade-in duration-300">
                        <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm text-center">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Eficiência</p>
                            <h2 class="text-3xl font-black text-slate-800">${stats.pct}%</h2>
                            <div class="mt-3 h-1.5 bg-slate-100 rounded-full overflow-hidden w-24 mx-auto">
                                <div class="h-full bg-indigo-500" style="width: ${stats.pct}%"></div>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                            <p class="text-slate-400 text-[10px] font-medium italic">Dados atualizados localmente.</p>
                        </div>
                    </div>
                `;
            }

            if (state.activeTab === 'estoque') {
                return `
                    <div class="space-y-3 animate-in fade-in duration-300">
                        <button onclick="toggleReport(true)" class="w-full bg-indigo-50 border border-indigo-100 text-indigo-600 py-3 rounded-xl font-bold text-[10px] uppercase tracking-widest flex items-center justify-center gap-2 active:scale-98 transition-all">
                            <i data-lucide="share" class="w-3.5 h-3.5"></i> Compartilhar
                        </button>
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <h3 class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">Necessidades</h3>
                            <div class="space-y-1.5">
                                ${Array.from(new Set(state.pedidos.filter(p => p.status !== 'Entregue').map(p => p.publicacao))).map(pub => `
                                    <div class="bg-slate-50 px-3 py-2 rounded-lg flex justify-between items-center border border-slate-100">
                                        <span class="text-[11px] font-semibold text-slate-600">${pub}</span>
                                        <span class="text-[10px] font-black text-indigo-600">${state.pedidos.filter(p => p.publicacao === pub && p.status !== 'Entregue').length}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // Tab Pedidos (Compacta)
            const filtered = state.pedidos.filter(p => {
                const matchesSearch = p.nome.toLowerCase().includes(state.searchTerm.toLowerCase()) || p.publicacao.toLowerCase().includes(state.searchTerm.toLowerCase());
                const matchesFilter = state.filterType === 'Todos' || p.categoria === state.filterType;
                return matchesSearch && matchesFilter && p.status !== 'Entregue';
            });

            return `
                <div class="space-y-3 animate-in fade-in">
                    <div class="flex items-center gap-2">
                        <div class="relative flex-1">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300 w-3.5 h-3.5"></i>
                            <input type="text" oninput="state.searchTerm=this.value; render()" value="${state.searchTerm}" placeholder="Pesquisar..." class="w-full pl-9 pr-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs shadow-sm focus:border-indigo-300 transition-all">
                        </div>
                        <button onclick="state.showFilters=!state.showFilters; render()" class="p-2.5 bg-white border border-slate-200 rounded-xl text-slate-400">
                            <i data-lucide="filter" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    ${state.showFilters ? `
                    <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar animate-in slide-in-from-top-2">
                        ${['Todos', 'Bíblia', 'Livro', 'Revista', 'Brochura'].map(c => `
                            <button onclick="setFilter('${c}')" class="px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-tighter whitespace-nowrap transition-all ${state.filterType === c ? 'bg-slate-800 text-white' : 'bg-white text-slate-400 border border-slate-200'}">${c}</button>
                        `).join('')}
                    </div>
                    ` : ''}

                    <div class="space-y-2 pb-16">
                        ${filtered.length ? filtered.map(p => `
                            <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3 group">
                                <button onclick="advanceStatus(${p.id})" class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 border transition-all ${p.status === 'Disponível' ? 'border-purple-200 bg-purple-50 text-purple-600' : 'border-slate-100 bg-slate-50 text-slate-200'}">
                                    <i data-lucide="check" class="w-4 h-4" stroke-width="4"></i>
                                </button>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-1.5 mb-0.5">
                                        <p class="text-[9px] font-black text-indigo-600 uppercase tracking-tighter truncate">${p.nome}</p>
                                        <span class="text-[8px] font-bold text-slate-300 uppercase">${p.categoria}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-700 text-[13px] truncate leading-tight">${p.publicacao}</h3>
                                    <div class="mt-1 flex items-center gap-2">
                                        <span class="text-[8px] font-black px-1.5 py-0.5 rounded uppercase tracking-tighter ${getStatusStyles(p.status)}">${p.status}</span>
                                    </div>
                                </div>
                                <button onclick="deletePedido(${p.id})" class="p-1.5 text-slate-200 hover:text-red-300 transition-colors"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                            </div>
                        `).join('') : '<p class="text-center py-6 text-slate-300 text-[10px] italic">Nada por aqui.</p>'}
                    </div>
                </div>
            `;
        }

        function renderAddModal() {
            return `
                <div class="absolute inset-0 z-[100] bg-slate-900/40 backdrop-blur-[2px] flex items-end">
                    <div class="bg-white w-full rounded-t-[2.5rem] p-6 animate-slide-up shadow-2xl">
                        <div class="flex justify-between items-center mb-5">
                            <h2 class="text-lg font-black text-slate-800 tracking-tight italic">Novo Item</h2>
                            <button onclick="toggleAdd(false)" class="p-2 bg-slate-50 rounded-full text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="handleAdd(event)" class="space-y-4">
                            <input name="nome" required placeholder="Nome do Solicitante" class="w-full p-3.5 bg-slate-50 rounded-xl border-none text-xs focus:ring-1 focus:ring-indigo-400 transition-all">
                            <input name="publicacao" required placeholder="Título da Publicação" class="w-full p-3.5 bg-slate-50 rounded-xl border-none text-xs focus:ring-1 focus:ring-indigo-400 transition-all">
                            <div class="grid grid-cols-2 gap-3">
                                <select name="categoria" class="w-full p-3.5 bg-slate-50 rounded-xl border-none text-xs appearance-none">
                                    <option>Bíblia</option><option>Livro</option><option>Revista</option><option>Brochura</option>
                                </select>
                                <input name="data" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-3.5 bg-slate-50 rounded-xl border-none text-xs">
                            </div>
                            <button class="w-full bg-slate-800 text-white font-black py-4 rounded-xl shadow-lg mt-2 uppercase tracking-widest text-[10px]">Salvar</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderReportModal(stats) {
            const relatorio = state.pedidos.filter(p => p.status === 'Pendente').map(p => `• ${p.publicacao}: ${p.nome}`).join('\n');
            return `
                <div class="absolute inset-0 z-[100] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-6">
                    <div class="bg-white w-full rounded-[2rem] p-6 animate-in zoom-in-95 duration-200 shadow-2xl">
                        <div class="flex justify-between items-center mb-5">
                             <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Relatório Rápuido</span>
                             <button onclick="toggleReport(false)" class="p-2 text-slate-300"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl mb-5 max-h-48 overflow-y-auto border border-slate-100">
                             <pre class="text-[10px] font-medium text-slate-600 leading-relaxed whitespace-pre-wrap">${relatorio || 'Sem itens pendentes.'}</pre>
                        </div>
                        <button onclick="copyReport()" class="w-full py-3.5 rounded-xl bg-slate-800 text-white font-black text-[10px] uppercase tracking-widest shadow-md active:scale-95 transition-all">
                            Copiar Texto
                        </button>
                    </div>
                </div>
            `;
        }

        // Ações
        window.changeTab = (tab) => { state.activeTab = tab; state.isAdding = false; render(); };
        window.toggleAdd = (val) => { state.isAdding = val; render(); };
        window.toggleReport = (val) => { state.showReport = val; render(); };
        window.setFilter = (val) => { state.filterType = val; render(); };
        
        window.handleAdd = (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            state.pedidos.unshift({
                id: Date.now(),
                nome: fd.get('nome'),
                publicacao: fd.get('publicacao'),
                categoria: fd.get('categoria'),
                data: fd.get('data'),
                status: 'Pendente'
            });
            state.isAdding = false;
            save();
        };

        window.advanceStatus = (id) => {
            const p = state.pedidos.find(x => x.id === id);
            const fluxo = { 'Pendente': 'Encomendado', 'Encomendado': 'Disponível', 'Disponível': 'Entregue', 'Entregue': 'Pendente' };
            p.status = fluxo[p.status];
            save();
        };

        window.deletePedido = (id) => {
            state.pedidos = state.pedidos.filter(x => x.id !== id);
            save();
        };

        window.copyReport = () => {
            const relatorio = state.pedidos.filter(p => p.status === 'Pendente').map(p => `• ${p.publicacao}: ${p.nome}`).join('\n');
            navigator.clipboard.writeText("*PEDIDOS DO BALCÃO*\n" + relatorio);
            alert("Texto copiado!");
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        render();
    </script>
</body>
</html>
